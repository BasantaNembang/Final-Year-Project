
name: CI/CD for backend & frontend docker images

on:
  push:
    branches: [ "adding_k8s" ]

jobs:

  build-and-push:
    timeout-minutes: 30
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - Back_End/Api-Gateway
          - Back_End/Auth-service
          - Back_End/Cart-Service
          - Back_End/Category-Service
          - Back_End/Chat-Service
          - Back_End/Course-Service
          - Back_End/Enrollment-Service
          - Back_End/Notify-Service
          - Back_End/Payment-Service
          - Back_End/Review-Service
          - Back_End/Stream-Service
          - Front_End/my-go-to            
  
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # Backend: set up JDK
    - name: Set up JDK 17 (backend only)
      if: startsWith(matrix.service, 'Back_End/')
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17

    # Backend: build with Maven
    - name: Build backend service
      if: startsWith(matrix.service, 'Back_End/')
      run: |
        cd ${{ matrix.service }}
        mvn clean install -DskipTests


    # Frontend: set up Node.js
    - name: Set up Node.js (frontend only)
      if: startsWith(matrix.service, 'Front_End/')
      uses: actions/setup-node@v4
      with:
        node-version: 20

    # Frontend: build Next.js
    - name: Build frontend
      if: startsWith(matrix.service, 'Front_End/')
      run: |
        cd ${{ matrix.service }}
        npm install
        npm run build


    # Docker login
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # Build & push Docker image (latest only)

    - name: Build & Push Docker Image
      run: |
        cd ${{ matrix.service }}

        SERVICE_NAME=$(basename "${{ matrix.service }}" | tr '[:upper:]' '[:lower:]')
        IMAGE_NAME=${{ secrets.DOCKER_USERNAME }}/$SERVICE_NAME
        IMAGE_TAG=${GITHUB_SHA::7}
        

        docker build -t $IMAGE_NAME:IMAGE_TAG .
        docker push $IMAGE_NAME:IMAGE_TAG



  argocd:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
    - name: Checkout GitOps repository
      uses: actions/checkout@v4
      with:
        repository: BasantaNembang/Final-Year-Project
        ref: adding_k8s
        token: ${{ secrets.REPO_TOKEN }}

    - name: Update image tags for all services
      run: |
        SERVICES=(
          "Back_End/Api-Gateway"
          "Back_End/Auth-service"
          "Back_End/Cart-Service"
          "Back_End/Category-Service"
          "Back_End/Chat-Service"
          "Back_End/Course-Service"
          "Back_End/Enrollment-Service"
          "Back_End/Notify-Service"
          "Back_End/Payment-Service"
          "Back_End/Review-Service"
          "Back_End/Stream-Service"
          "Front_End/my-go-to"
        )

        for SERVICE in "${SERVICES[@]}"; do
          NAME=$(basename "$SERVICE" | tr '[:upper:]' '[:lower:]')
          IMAGE_TAG=${GITHUB_SHA::7}
          K8S_FILE="k8s/apps/$NAME.yaml"

          if [ -f "$K8S_FILE" ]; then
            sed -i "s|image: .*/$NAME:.*|image: ${{ secrets.DOCKER_USERNAME }}/$NAME:$IMAGE_TAG|g" "$K8S_FILE"                               
          fi
        done

    - name: Commit & Push Changes
      run: |
        git config user.name "basanta"
        git config user.email "basanta@gmai.com"

        git diff --quiet || (
          git add .
          git commit -m "Update all service images to ${GITHUB_SHA::7}"
          git push origin adding_k8s
        )



# here basename in linux retrun the last part of the path  i.e matrix.service is like :: Back_End/Api-Gateway
# becomes Api-Gateway, and | tr '[:upper:]' '[:lower:]' comvert to api-gateway
# ${{}} for env var
#${} for run time

