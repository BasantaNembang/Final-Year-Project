
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
          - containerPort: 8080

        volumeMounts:
          - name: videos-storage
            mountPath: /data

          - name: nginx-config
            mountPath: /etc/nginx/nginx.conf
            subPath: nginx.conf

      volumes:
        - name: videos-storage
          persistentVolumeClaim:
            claimName: videos-pvc

        - name: nginx-config
          configMap:
            name: nginx-config-cmap

---


apiVersion: v1
kind: Service
metadata:
  name: nginx-svc
spec:
  type: NodePort
  selector:
    app: nginx
  ports:
    - port: 9292
      targetPort: 8080



