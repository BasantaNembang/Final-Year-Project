
---

apiVersion: v1
kind: ConfigMap
metadata:
  name: common-db-cmap
data:
  db_host: mysql:3306




---


apiVersion: v1
kind: ConfigMap
metadata:
  name: services-name-cmap
data:
  auth_service_url: http://auth-service-svc.default.svc.cluster.local:8081/auth
  payment_url: http://payment-service-svc.default.svc.cluster.local:8088
  course_service_url: http://course-service-svc.default.svc.cluster.local:8084/course



---


apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-cmap
data:
  spring_bootstrap_servers: kafka-svc:29092
  spring_schema_registry_uri: http://schema-registry-svc:8095


