
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart-service
spec:
  selector:
    matchLabels:
      app: cart-service
  template:
    metadata:
      labels:
        app: cart-service
    spec:
      containers:
      - name: cart-service
        image: basantanembang10/cart-service:latest

        ports:
        - containerPort: 8092

        env:
          - name: DB_HOST
            valueFrom:
              configMapKeyRef:
                key: db_host
                name: common-db-cmap

          - name: COURSE_SERVICE_URL
            valueFrom:
              configMapKeyRef:
                key: course_service_url
                name: services-name-cmap            

---


apiVersion: v1
kind: Service
metadata:
  name: cart-service-svc
spec:
  selector:
    app: cart-service
  ports:
  - protocol: TCP
    port: 8092
    targetPort: 8092


