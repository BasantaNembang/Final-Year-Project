
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
spec:
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
      - name: auth-service
        image: basantanembang10/auth-service:latest

        ports:
        - containerPort: 8081

        env:
          - name: DB_Host
            valueFrom:
              configMapKeyRef:
                key: db_host
                name: common-db-cmap

---

apiVersion: v1
kind: Service
metadata:
  name: auth-service-svc
spec:
  selector:
    app: auth-service
  ports:
  - port: 8081
    targetPort: 8081

      

