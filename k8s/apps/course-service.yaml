
apiVersion: apps/v1
kind: Deployment
metadata:
  name: course-service
spec:
  selector:
    matchLabels:
      app: course-service
  template:
    metadata:
      labels:
        app: course-service
    spec:
      containers:
      - name: course-service
        image: basantanembang10/course-service:latest

        ports:
        - containerPort: 8084

        volumeMounts:
          - name: videos-storage
            mountPath: /videos           

        env:
          - name: MONGODB_URL
            valueFrom:
              secretKeyRef:
                key: mongodb_uri
                name: mongo-atlas-secret

          - name: AUTH_SERVICE_URL
            valueFrom:
              configMapKeyRef:
                key: auth_service_url
                name: services-name-cmap

          - name: SPRING_BOOTSTRAP_SERVERS
            valueFrom:
              configMapKeyRef:
                key: spring_bootstrap_servers
                name: kafka-cmap

          - name: SPRING_SCHEMA_REGISTRY_URL
            valueFrom:
              configMapKeyRef:
                key: spring_schema_registry_uri
                name: kafka-cmap

      volumes:
        - name: videos-storage
          persistentVolumeClaim:
            claimName: videos-pvc     


---

apiVersion: v1
kind: Service
metadata:
  name: course-service-svc
spec:
  selector:
    app: course-service
  ports:
  - port: 8084
    targetPort: 8084

    



