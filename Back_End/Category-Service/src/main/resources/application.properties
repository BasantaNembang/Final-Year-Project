
server.port=8082
spring.application.name=CATEGORY-SERVICE

spring.datasource.url=jdbc:mysql://localhost:3306/categorydb
spring.datasource.username=root
spring.jpa.hibernate.ddl-auto=update

jwt.secret=ThisIsMyJwtSecretKey123456789ABCDEF

management.endpoints.web.exposure.include=health, info, metrics, prometheus
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.observations.key-values.application=CATEGORY-SERVICE

management.tracing.sampling.probability=1.0
