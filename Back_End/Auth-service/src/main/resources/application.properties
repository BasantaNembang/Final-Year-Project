spring.application.name=AUTH-SERVICE

spring.datasource.url=jdbc:mysql://localhost:3306/authdb
spring.datasource.username=root
spring.jpa.hibernate.ddl-auto=update

jwt.secret=ThisIsMyJwtSecretKey123456789ABCDEF

server.port=8081



# Maximum file size allowed for a single file upload
spring.servlet.multipart.max-file-size=20MB

# Maximum request size allowed for multipart/form-data requests
spring.servlet.multipart.max-request-size=20MB

management.endpoints.web.exposure.include=health, info, metrics, prometheus
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.observations.key-values.application=AUTH-SERVICE

management.tracing.sampling.probability=1.0